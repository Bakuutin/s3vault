[package]
name = "s3vault"
description = "Encrypting S3 gateway: clients speak S3 to it; it stores only ciphertext (content and names) in the store of record, with optional read-through from a legacy store"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "s3vault"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
default = ["sqlcipher"]
# Encrypt the local index database with SQLCipher (vendored OpenSSL). Without it the index is plain sqlite.
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
plain-sqlite = ["rusqlite/bundled"]

[dependencies]
s3vault-format.workspace = true
s3s = "0.17"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "http1", "http2", "tokio"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs", "io-util"] }
futures = "0.3"
bytes = "1"
async-trait = "0.1"
rusty-s3 = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
url = "2"
rusqlite = { version = "0.37" }
serde.workspace = true
serde_json.workspace = true
toml = "0.9"
thiserror.workspace = true
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2.workspace = true
md-5.workspace = true
hex.workspace = true
rand.workspace = true
zeroize.workspace = true
data-encoding.workspace = true
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
httpdate = "1"
sync_wrapper = { version = "1", features = ["futures"] }

[dev-dependencies]
s3s-fs = "0.17"
tempfile = "3"
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
