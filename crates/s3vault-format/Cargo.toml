[package]
name = "s3vault-format"
description = "s3vault object format, keyring and key-service protocol (pure Rust, no async runtime)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chacha20poly1305.workspace = true
hkdf.workspace = true
hmac.workspace = true
sha2.workspace = true
rand.workspace = true
zeroize.workspace = true
data-encoding.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
subtle.workspace = true
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
p256 = { version = "0.13", features = ["ecdh"] }
toml = "0.9"

[features]
# Test builds only: S3VAULT_CRASH_AT=<point> aborts at a write step (testenv crash injection).
fault-injection = []

[dev-dependencies]
hpke = { version = "0.12", default-features = false, features = ["alloc", "x25519", "p256"] }
