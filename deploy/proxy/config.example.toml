# s3vault configuration example. Addresses use placeholders: 100.64.0.2 is the proxy's private (e.g. Tailscale)
# address, 100.64.0.1 the key service host. Bucket `app` migrates from a legacy plain store; `scratch` is new.
# Secrets are never inline: every *_file below is a separate file, mode 600/640, root:s3vault.

[server]
# Private addresses only: loopback and a private (e.g. Tailscale) address. Never a public IP.
listen = ["127.0.0.1:9100", "100.64.0.2:9100"]
admin_listen = "127.0.0.1:9101"          # loopback only
admin_token_file = "/etc/s3vault/secrets/admin.token"   # s3vault gen-admin-token --out ...
data_dir = "/var/lib/s3vault"
region = "us-east-1"
memory_spool_max = 16777216          # bodies above 16 MiB spool to encrypted local files
store_multipart_threshold = 536870912
store_multipart_part = 67108864
index_snapshot_secs = 21600          # encrypted index snapshot every 6 h when it changed
upload_ttl_hours = 168

[keys]
# The keyring comes from s3vault-keyd on another host and is held in RAM only. Until it arrives every request is 503.
source = "keyd"
keyd_addr = "100.64.0.1:7373"
psk_file = "/etc/s3vault/secrets/keyd.psk"
retry_secs = 10

# Store of record: any S3. Here a Garage on loopback; for Backblaze B2 see README.md.
[stores.primary]
endpoint = "http://127.0.0.1:3910"
region = "garage"
bucket = "s3vault-store"
credentials_file = "/etc/s3vault/secrets/store-local-garage.toml"
prefix = "o/"
read_timeout_secs = 120

# Read-through source (plain, read-only key). Used for keys the store of record does not have yet.
[fallbacks.legacy]
endpoint = "http://100.64.0.1:3900"
region = "garage"
credentials_file = "/etc/s3vault/secrets/fallback-legacy.toml"
connect_timeout_secs = 5
read_timeout_secs = 60

[[buckets]]
name = "app"
store = "primary"
fallback = { source = "legacy", bucket = "app" }

[[buckets]]
name = "scratch"
store = "primary"

# Clients: access keys scoped per bucket. Generate with `s3vault gen-client --secret-out FILE`.
[[clients]]
name = "admin-test"
access_key_id = "SVEXAMPLEEXAMPLE"
secret_file = "/etc/s3vault/secrets/client-admin-test.secret"
buckets = ["scratch"]
read_buckets = ["app"]

[fill]
concurrency = 4
rate_bytes_per_sec = 1000000         # default fill budget; live read-through misses are not limited
yield_ms = 250
reconcile_max_fraction = 0.01        # reconcile refuses to drop more than 1% of filled rows without force=1
