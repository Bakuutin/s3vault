# s3vault key service. Serves the master keyring only to allow-listed proxy addresses that prove the PSK.
# Lives in its own directory (e.g. /srv/s3vault-keyd/) with ./keys (root, 700; files 600).
#   first time:  docker compose build && docker compose run --rm init
#   run:         docker compose up -d keyd
# Edit LISTEN (this host's private address; placeholder 100.64.0.1) and ALLOW (the proxy's address;
# placeholder 100.64.0.2) below.
services:
  keyd:
    build: .
    image: s3vault-keyd:local
    container_name: s3vault-keyd
    command: ["serve", "--dir", "/keys", "--listen", "100.64.0.1:7373", "--allow", "100.64.0.2"]
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
    volumes:
      - ./keys:/keys:ro
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "3" }

  # One-shot helpers (profile "admin" keeps them out of `up`).
  # Generic admin entry: docker compose run --rm admin <command> --dir /keys [...]
  # (tenant-create, tenant-erase, tenant-list, escrow-cat, tenant-escrow-confirm, escrow-prune,
  #  escrow-confirm, rotate, upgrade-v2, ledger-import, ledger-show, fingerprint). No network.
  admin:
    profiles: ["admin"]
    image: s3vault-keyd:local
    entrypoint: ["/s3vault-keyd"]
    network_mode: none
    volumes:
      - ./keys:/keys
  init:
    profiles: ["admin"]
    image: s3vault-keyd:local
    command: ["init", "--dir", "/keys"]
    network_mode: none
    volumes:
      - ./keys:/keys
  rotate:
    profiles: ["admin"]
    image: s3vault-keyd:local
    command: ["rotate", "--dir", "/keys"]
    network_mode: none
    volumes:
      - ./keys:/keys
  escrow-export:
    profiles: ["admin"]
    image: s3vault-keyd:local
    command: ["escrow-export", "--dir", "/keys"]
    network_mode: none
    volumes:
      - ./keys:/keys:ro
  escrow-confirm:
    profiles: ["admin"]
    image: s3vault-keyd:local
    entrypoint: ["/s3vault-keyd", "escrow-confirm", "--dir", "/keys"]
    network_mode: none
    volumes:
      - ./keys:/keys
  fingerprint:
    profiles: ["admin"]
    image: s3vault-keyd:local
    command: ["fingerprint", "--dir", "/keys"]
    network_mode: none
    volumes:
      - ./keys:/keys:ro
